# XcodeGen spec for the native Koh Tao Climbing guide (phase A).
# Regenerate after changing this file:  xcodegen generate   (run from native/)
name: KohTaoClimbing
options:
  bundleIdPrefix: com.kohtaoclimbing
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

# Treat .icon (Icon Composer document) as a single file in Resources, matching
# what Xcode creates by hand — the build system compiles it into the app icon.
fileTypes:
  icon:
    file: true
    buildPhase: resources

targets:
  KohTaoClimbing:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: KohTaoClimbing/Sources
      - path: KohTaoClimbing/Assets.xcassets
      # iOS 26 Liquid Glass icon (Icon Composer document) — compiled by the build
      # system; ASSETCATALOG_COMPILER_APPICON_NAME points at its basename.
      - path: KohTaoClimbing/AppIcon.icon
      # Whole folder copied into the bundle as a folder reference (blue folder),
      # preserving Data/, Images/{guide,community}/ and Tiles/{z}/{x}/{y}.png structure.
      # NOTE: must NOT be named "Resources" — a top-level Resources/ folder in an iOS
      # bundle collides with macOS bundle-layout detection and installd then rejects
      # the app with "Missing bundle ID" (simctl install IXErrorDomain 13).
      - path: KohTaoClimbing/AppResources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kohtaoclimbing.guide
        INFOPLIST_FILE: KohTaoClimbing/Info.plist
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "2"
        # Xcode Cloud manages signing with the team selected in the flow UI.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JAT5L64V29

  # Hosted unit tests — they run inside the app process, so Bundle.main in the
  # tests sees the real AppResources the app ships.
  KohTaoClimbingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: KohTaoClimbing/Tests
    dependencies:
      - target: KohTaoClimbing
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KohTaoClimbing:
    build:
      targets:
        KohTaoClimbing: all
        KohTaoClimbingTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KohTaoClimbingTests
